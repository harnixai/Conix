# xforge 流程包的治理开关（docs/design/xforge.md §1）：哪几条基线由这个项目治理。
# 整个文件在运行启动时读一次、钉进运行：改了只管之后启动的运行，在跑的照旧。
governance:
  spec: true        # 规格基线：xforge/specs/
  interface: true   # 接口基线：xforge/interfaces/
review:
  separate: false   # 作者也能批；团队要分开（交付过的人不能确认）就改 true
  # 检视点：检视线（与开发线不同的模型）在哪几处检视。缺省 major 开设计阶段的 spec、design、tests-design，solid 都关。
  # 全链条检视要人手工开：major: {code: true, tests: true, verify: true}。
  major: {spec: true, design: true, tests-design: true, code: false, tests: false, verify: false}
  solid: {spec: false, design: false, tests-design: false, code: false, tests: false, verify: false}

# 三条线的模型：开发线写提案、设计、代码；测试线照规格写黑盒测试；检视线检视，要与开发线不同。
# 换成实例里配了的模型（Conix 里 /model 列出的）；没写的线用实例的缺省模型。
lines:
  build: {model: claude-sonnet-5-5}
  tests: {model: deepseek-chat}
  review: {model: deepseek-chat}

# 门禁的进程在沙箱里只读：项目的验证（verify.sh）要写构建、缓存目录或要联网的在这里声明。能写的只能是被 git 忽略的目录
# （门禁判活不干活，写不了交付的文件）。比如 Rust 项目：writable: [target]。
checks:
  writable: []
  network: false

# 工作包可以选的验证（人声明，进 git）：xpkg plan --verify <名字>[:参数=值] 按名字选，任务交付时门禁 package-tests
# 照 argv 直接起进程（不经 shell），退出码 0 才过。参数只能填进 {参数} 的位置，值要整串匹配这里的正则。
# 一项要写构建、缓存目录或要联网的，加 writable: [target]（只给被 git 忽略的目录）、network: true。
verify:
  unit:
    description: 全部单测
    argv: [python3, -m, unittest, discover, -s, tests, -q]
  test:
    description: 一个测试文件（tests/<file>.py）
    argv: [python3, -m, unittest, discover, -s, tests, -q, -p, "{file}.py"]
    params: {file: "test_[a-z0-9_]+"}
  compile:
    description: 源码都能编译
    argv: [python3, -m, compileall, -q, src]
  blackbox:
    description: 黑盒测试（tests_blackbox/）：只经 textkit 的公开接口照规格测。solid、major 两路合起来时门禁 blackbox 跑它，测试线写在这里
    argv: [python3, -m, unittest, discover, -s, tests_blackbox, -q]

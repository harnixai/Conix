name: xforge
title: XForge 开发流程
description: >-
  规格驱动的变更：提案与规格、接口增量，设计与工作包，独立检查，按工作包实施，验证，归档并进基线。
  按风险选路：quick 是低风险的小改动，solid 是常规变更，major 是高风险或跨系统的变更（先澄清）。
  dual 是双路开发：规格侧批准后分成实现与黑盒测试两个子运行（dual-impl、dual-tests），合起来用测试跑实现；点名起。
version: 0.3.1
flows: [quick, solid, major, dual, dual-impl, dual-tests]
# 只按风险选这三条：dual 多花一倍的力气换一套独立的测试，值不值由人定（分诊可以建议），点名起；
# 它的两个子运行只由 dual 的 fork 站起。
start:
  route: [quick, solid, major]
  triage: triage
pace: auto
commands:
  xspec: {read_only: [list, get, delta, check, pending, seal, help]}
  xarch: {read_only: [modules, list, get, delta, check, pending, help]}
  xledger: {read_only: [list, help]}
  xpkg: {read_only: [list, verify-menu, help]}
# 项目的治理文件（docs/design/xforge.md §1）：启动时读、合并缺省、钉进运行，门禁与命令经 flow.settings 读，
# 确认出口经 ${settings.review.separate} 读。
settings:
  file: .conix/governance/xforge.yaml
  defaults:
    governance: {spec: true, interface: false}
    review: {separate: false}
# 自检（docs/design/xforge.md §7）：宿主的 conix flow doctor 在运行之外为项目跑 scripts/doctor.js，只读、不修。
doctor: doctor

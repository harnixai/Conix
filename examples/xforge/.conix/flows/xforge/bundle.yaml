name: xforge
title: XForge 开发流程
description: >-
  规格驱动的变更：提案与规格、接口增量，设计与工作包，独立检查，按工作包实施，验证，归档并进基线。
  按风险选路：quick 是低风险的小改动，solid 是常规变更，major 是高风险或跨系统的变更（先澄清）。
version: 0.2.0
flows: [quick, solid, major]
start:
  route: [quick, solid, major]
  triage: triage
pace: auto
commands:
  xspec: {read_only: [list, get, delta, check, pending, help]}
  xarch: {read_only: [modules, list, get, delta, check, pending, help]}
  xledger: {read_only: [list, help]}
  xpkg: {read_only: [list, help]}
# 项目的治理文件（docs/design/xforge.md §1）：启动时读、合并缺省、钉进运行，门禁与命令经 flow.settings 读，
# 确认出口经 ${settings.review.separate} 读。
settings:
  file: .conix/governance/xforge.yaml
  defaults:
    governance: {spec: true, interface: false}
    review: {separate: false}

name: dual
title: 双路开发
description: >-
  规格侧（提案、规格增量、接口增量）写一次、独立检查、人批准；然后分成两个子运行，各在自己的 worktree 里、从同一个分叉提交出发：
  一个照规格设计并实现，一个只照规格写黑盒测试、看不到实现。两路合回来后用黑盒测试跑实现，验证、归档。
  高风险、值得花两份力气要一套独立测试的变更用它；不在按风险选路里，点名起：flow_start {flow: "xforge/dual"}。
# 分叉要往运行自己的分支上提交：用户的分支从不自动提交（docs/design/flows.md §6.5）。
workspace: worktree
inputs:
  title:
    schema: {type: string, minLength: 1}
    description: 变更的短标题，也是归档的名字
  risk:
    schema: {enum: [low, medium, high]}
    description: 风险：low 小而局部、好回退；medium 常规改动；high 跨模块、动接口或数据、难回退。这条流程都收
  impact:
    schema: {type: array, uniqueItems: true, items: {enum: [interface, security, data-migration, infra]}}
    default: []
    description: 影响面：动了对外接口 interface，动了鉴权与数据安全 security，要迁移数据 data-migration，动了部署与基础设施 infra
policies: [by-commands]
archive:
  name: "${date}${seq}-${inputs.title}"
  # 两路各自的设计、台账、工作包在 children/ 里：只留声明的制品就丢了一半的来龙去脉。
  keep: [proposal.md, verification.md, spec-delta.yaml, interface-delta.yaml, "ledgers/**", "children/**"]
stations:
  - id: propose
    title: 提案
    executor: {kind: session}
    skill: propose
    writes: ["${output_dir}/**"]
    deliverables:
      - {path: proposal.md, template: proposal.md, description: 提案：背景、目标、非目标、改什么、影响面、为什么选这条流程}
    output: {type: object, required: [summary], properties: {summary: {type: string}}}
    exit:
      - {kind: output}
      - {kind: gate, gate: proposal-sections}
      - {kind: gate, gate: impact}
      - {kind: gate, gate: spec-delta-shape}
      - {kind: gate, gate: spec-delta}
      - {kind: gate, gate: interface-delta}
      # 没有父运行的设计站：破坏性的接口改动在提案这里就要有接受了的决定。
      - {kind: gate, gate: interface-compat}
      # 规格侧检查记下发现、打回这里时：发现由这一站改完结掉（xledger set findings … resolved）。不在这里查，
      # 开着的发现要到澄清站才挡住，而澄清的会话只问问题、结不了它，运行就卡在那里。
      - {kind: gate, gate: ledgers-settled}
      # 破坏性的改动还要项目的主人点头：要不要由门禁算出的 breaking 定（不由模型交的输出定，门禁没结论就当要）。
      # 批的是接口增量；规格侧检查批的也绑着它，之后再改要回来重批。
      - kind: confirm
        who: owner
        label: 批准破坏性改动
        when: {gate: interface-compat, fact: breaking}
        separate: "${settings.review.separate}"
        binds: ["${output_dir}/interface-delta.yaml"]
    on_unmet: {rework_to: propose, max: 2}

  # 不自动打回：问题要人答，答完人重跑这一站的出口（/xforge:clarify），再确认。
  - id: clarify
    title: 澄清
    executor: {kind: session}
    skill: clarify
    writes: ["${output_dir}/**"]
    output:
      type: object
      required: [summary]
      properties: {summary: {type: string}, questions: {type: integer, minimum: 0}}
    exit:
      - {kind: output}
      - {kind: gate, gate: ledgers-settled}
      - {kind: confirm, who: owner, label: 范围定了, separate: "${settings.review.separate}", binds: ["${output_dir}/ledgers/questions.yaml"]}
    rework_to: [propose]

  # 规格侧的独立检查：还没有设计，只看提案、规格、接口与原则。批了就是规格侧定了：绑住它，两路照的是同一份。
  - id: check
    title: 规格侧检查
    executor: {kind: agent}
    skill: spec-check
    policies: [review-only]
    output:
      type: object
      required: [summary, ready]
      properties:
        summary: {type: string}
        ready: {type: boolean}
        rework:
          type: object
          required: [to, reason]
          properties: {to: {enum: [clarify, propose]}, reason: {type: string}}
    exit:
      - {kind: output}
      - {kind: gate, gate: ledgers-settled}
      - {kind: gate, gate: constitution-reply}
      - kind: confirm
        who: reviewer
        label: 规格侧定了
        separate: "${settings.review.separate}"
        binds: [deliverables, "${output_dir}/spec-delta.yaml", "${output_dir}/interface-delta.yaml", "${output_dir}/ledgers/questions.yaml"]
    rework_to: [clarify, propose]

  # 命令步骤：分叉前封存规格侧每个文件的摘要，交给两个子运行（输入 spec_side），它们的门禁 spec-unchanged 拿它核对。
  # 摘要在运行的记录里，子运行改不到；放进规格侧的文件里，子运行改规格侧时顺手就能改掉。
  - id: seal
    title: 封存规格侧
    executor: {kind: command, command: xspec, args: [seal]}
    output:
      type: object
      required: [files]
      properties: {files: {type: object, minProperties: 1, additionalProperties: {type: string}}, count: {type: integer}}
    exit:
      - {kind: output}

  # 两个子运行从同一个分叉提交分出去，各在自己的 worktree 里，互相读不到（§6.5）。交付了就由派工器合回这次运行的分支。
  # 打回到这一站：整站打回两路都重新分叉；只打回一个任务（flow_rework 的 tasks）只重做那一路，另一路的结果留着。
  # 新一轮的分叉提交里已经有上一轮两路合回来的东西：重做的那一路看得见另一路上一轮的工作，不再是互相独立的。
  - id: fork
    title: 分两路
    tasks:
      - id: impl
        executor:
          kind: subflow
          flow: dual-impl
          workspace: worktree
          inputs: {title: "${inputs.title}", spec_side: "${stations.seal.output.files}"}
      - id: tests
        executor:
          kind: subflow
          flow: dual-tests
          workspace: worktree
          inputs: {title: "${inputs.title}", spec_side: "${stations.seal.output.files}"}
    exit:
      - {kind: children, require: all}
    rework_to: [propose]

  # 两路都合进来了：用黑盒测试跑实现。不自动打回：没过的根在实现还是在测试，由会话按规格判断、记进台账，人决定打回哪一路。
  - id: join
    title: 合起来
    executor: {kind: session}
    skill: join
    writes: ["${output_dir}/**"]
    output:
      type: object
      required: [summary, failures]
      properties:
        summary: {type: string}
        failures: {type: integer, minimum: 0}
        rework:
          type: object
          required: [tasks, reason]
          properties:
            tasks: {type: array, minItems: 1, uniqueItems: true, items: {enum: [impl, tests]}}
            reason: {type: string}
    exit:
      - {kind: output}
      - {kind: gate, gate: blackbox}
      - {kind: gate, gate: ledgers-settled}
      - {kind: confirm, who: owner, label: 两路对上了, separate: "${settings.review.separate}"}
    rework_to: [fork, propose]

  - id: verify
    title: 验证
    executor: {kind: session}
    skill: verify
    writes: ["${output_dir}/**"]
    deliverables:
      - {path: verification.md, template: verification.md, description: 验证记录：覆盖（每条需求、每个元素的结论与测试）、连贯性}
    output: {type: object, required: [summary], properties: {summary: {type: string}}}
    exit:
      - {kind: output}
      - {kind: gate, gate: verification}
      - {kind: gate, gate: unit-tests}
      - {kind: confirm, who: owner, label: 验收, separate: "${settings.review.separate}"}
    rework_to: [fork, join]

  - id: archive
    title: 归档
    tasks:
      - {id: specs, executor: {kind: command, command: xspec, args: [archive]}}
      - {id: interfaces, executor: {kind: command, command: xarch, args: [archive]}}
    output: {type: object}
    exit:
      - {kind: output}
      - {kind: gate, gate: archived}
      - {kind: gate, gate: interfaces-archived}

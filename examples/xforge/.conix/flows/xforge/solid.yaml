name: solid
title: 常规变更
description: 低到中风险的变更：提案、设计、独立检查、按工作包实施、验证、归档。
inputs:
  title:
    schema: {type: string, minLength: 1}
    description: 变更的短标题，也是归档的名字
  risk:
    schema: {enum: [low, medium]}
    default: medium
policies: [by-commands]
archive:
  name: "${date}${seq}-${inputs.title}"
stations:
  - id: propose
    title: 提案
    executor: {kind: session}
    skill: propose
    deliverables:
      - {path: proposal.md, template: proposal.md, description: 提案：为什么、改什么、不改什么}
    output: {type: object, required: [summary], properties: {summary: {type: string}}}
    exit:
      - {kind: output}
      - {kind: gate, gate: proposal-sections}
      - {kind: gate, gate: spec-delta-shape}
      - {kind: gate, gate: spec-delta}
    on_unmet: {rework_to: propose, max: 2}

  - id: design
    title: 设计
    executor: {kind: session}
    skill: design
    deliverables:
      - {path: design.md, template: design.md, description: 设计：做法、取舍、原则对照、工作包}
    output:
      type: object
      required: [summary, packages]
      properties:
        summary: {type: string}
        packages:
          type: array
          minItems: 1
          items: {type: object, required: [id, title], properties: {id: {type: string}, title: {type: string}}}
    exit:
      - {kind: output}
      - {kind: gate, gate: design-sections}
      - {kind: gate, gate: constitution}
      - {kind: gate, gate: spec-delta-shape}
      - {kind: gate, gate: spec-delta}
      - {kind: gate, gate: packages-planned}
      - {kind: gate, gate: ledgers-settled}
    on_unmet: {rework_to: design, max: 2}
    rework_to: [propose]

  - id: check
    title: 独立检查
    executor: {kind: agent}
    skill: check
    policies: [review-only]
    output: {type: object, required: [summary, ready], properties: {summary: {type: string}, ready: {type: boolean}}}
    exit:
      - {kind: output}
      - {kind: gate, gate: ledgers-settled}
      - {kind: confirm, who: reviewer, label: 检查通过}
    rework_to: [design, propose]

  - id: apply
    title: 实施
    foreach: "${stations.design.output.packages}"
    max_parallel: 1
    executor: {kind: agent}
    skill: apply
    output:
      type: object
      required: [package, status, summary]
      properties: {package: {type: string}, status: {enum: [done, blocked]}, summary: {type: string}}
    exit:
      - {kind: output}
      - {kind: gate, gate: packages-done}
      - {kind: gate, gate: unclaimed}
      - {kind: gate, gate: unit-tests}
    on_unmet: {rework_to: apply, max: 2}
    rework_to: [design]

  - id: verify
    title: 验证
    executor: {kind: session}
    skill: verify
    deliverables:
      - {path: verification.md, template: verification.md, description: 验证记录：每条需求怎么验证的、结论}
    output: {type: object, required: [summary], properties: {summary: {type: string}}}
    exit:
      - {kind: output}
      - {kind: gate, gate: verification}
      - {kind: confirm, who: owner, label: 验收}
    rework_to: [apply, design]

  - id: archive
    title: 归档
    executor: {kind: session}
    skill: archive
    output: {type: object, required: [summary], properties: {summary: {type: string}}}
    exit:
      - {kind: output}
      - {kind: gate, gate: archived}
    on_unmet: {rework_to: archive, max: 2}

name: major
title: 重大变更
description: >-
  高风险或跨系统的变更，三条线。开发线写提案（规格侧），人答澄清的问题；检视线检视规格侧，人批准、封存。然后分两路，
  各在自己的 worktree 里、从同一个分叉提交出发：开发线照规格设计并实现，测试线只照规格写黑盒测试、看不到实现；
  两路的设计都由检视线检视。合起来用黑盒测试跑实现，验证、验收、归档。
  检视点由治理文件的 review.major 开关：缺省开 spec、design、tests-design，code、tests、verify 要人手工开。
# 分叉要往运行自己的分支上提交：用户的分支从不自动提交（docs/design/flows.md §6.5）。
workspace: worktree
# 开发线的模型：治理文件的 lines.build（没写就是实例的缺省模型）。父运行的会话站都在主会话里。
main: {model: "${settings.lines.build.model}", provider: "${settings.lines.build.provider}"}
inputs:
  title:
    schema: {type: string, minLength: 1}
    description: 变更的短标题，也是归档的名字
  risk:
    schema: {enum: [low, medium, high]}
    description: 风险：low 小而局部、好回退；medium 常规改动；high 跨模块、动接口或数据、难回退。这条流程都收
  impact:
    schema: {type: array, uniqueItems: true, items: {enum: [interface, security, data-migration, infra]}}
    default: []
    description: 影响面：动了对外接口 interface，动了鉴权与数据安全 security，要迁移数据 data-migration，动了部署与基础设施 infra
policies: [by-commands]
archive:
  name: "${date}${seq}-${inputs.title}"
  # 两路各自的设计、台账、工作包在 children/ 里：只留声明的制品就丢了一半的来龙去脉。
  keep: [proposal.md, verification.md, spec-delta.yaml, interface-delta.yaml, "ledgers/**", "children/**"]
stations:
  # 进站就判、不调模型：写出三条线各用什么模型；检视线没写或与开发线同一个模型只告警（检视不是另一双眼睛，但照跑）。
  # 设置钉在运行里，改了治理文件要重新起。
  - id: lines
    title: 核对三条线
    exit:
      - {kind: gate, gate: lines}

  - id: propose
    title: 提案
    executor: {kind: session}
    skill: propose
    writes: ["${output_dir}/**"]
    deliverables:
      - {path: proposal.md, template: proposal.md, description: 提案：背景、目标、非目标、改什么、影响面、为什么选这条流程}
    output: {type: object, required: [summary], properties: {summary: {type: string}}}
    exit:
      - {kind: output}
      - {kind: gate, gate: proposal-sections}
      - {kind: gate, gate: impact}
      - {kind: gate, gate: spec-delta-shape}
      - {kind: gate, gate: spec-delta}
      - {kind: gate, gate: interface-delta}
      # 父运行没有设计站：破坏性的接口改动在提案这里就要有接受了的决定。
      - {kind: gate, gate: interface-compat}
      # 检视线打回这里时带着的发现由这一站修掉（resolved）或不同意（disputed，交回检视线定）；开着的挡住这一站。
      - {kind: gate, gate: ledgers-settled}
      # 破坏性的改动还要项目的主人点头：要不要由门禁算出的 breaking 定（不由模型交的输出定，门禁没结论就当要）。
      - kind: confirm
        who: owner
        label: 批准破坏性改动
        when: {gate: interface-compat, fact: breaking}
        separate: "${settings.review.separate}"
        binds: ["${output_dir}/interface-delta.yaml"]
      # 增量动到的比启动时声明的多（门禁 impact 的事实 widened）：声明是人定的，多出来的也要人认。
      - kind: confirm
        who: owner
        label: 影响面扩大
        when: {gate: impact, fact: widened}
        separate: "${settings.review.separate}"
        binds: ["${output_dir}/proposal.md", "${output_dir}/interface-delta.yaml"]
    on_unmet: {rework_to: propose, max: 2}

  # 不自动打回：问题要人答，答完人重跑这一站的出口（/xforge:clarify），再确认。
  - id: clarify
    title: 澄清
    executor: {kind: session}
    skill: clarify
    writes: ["${output_dir}/**"]
    output:
      type: object
      required: [summary]
      properties: {summary: {type: string}, questions: {type: integer, minimum: 0}}
    exit:
      - {kind: output}
      - {kind: gate, gate: ledgers-settled}
      - {kind: confirm, who: owner, label: 范围定了, separate: "${settings.review.separate}", binds: ["${output_dir}/ledgers/questions.yaml"]}
    rework_to: [propose]

  # 检视线检视规格侧（检视点 spec）：两个互不相见的人照它会不会做出不一样的东西。发现没结清就自动打回提案，至多两次，之后等人。
  - id: review-spec
    title: 检视规格侧
    when: [{path: settings.review.major.spec, eq: true, label: 检视点 spec 开着（review.major.spec）}]
    executor: {kind: agent, model: "${settings.lines.review.model}"}
    skill: review-spec
    policies: [review-only]
    output:
      type: object
      required: [summary, ready]
      properties: {summary: {type: string}, ready: {type: boolean}}
    exit:
      - {kind: output}
      - {kind: gate, gate: ledgers-settled}
      # 原则没答全是检视自己的活，不该把提案打回去。
      - {kind: gate, gate: constitution-reply, rework_to: review-spec}
    on_unmet: {rework_to: propose, max: 2}
    rework_to: [clarify, propose]

  # 命令步骤：封存规格侧每个文件的摘要，交给两个子运行（输入 spec_side），它们的门禁 spec-unchanged 拿它核对。
  # 摘要在运行的记录里，子运行改不到。人在这里批准规格侧：批了就是两路照的是同一份，绑住它。
  - id: seal
    title: 封存规格侧
    executor: {kind: command, command: xspec, args: [seal]}
    output:
      type: object
      required: [files]
      properties: {files: {type: object, minProperties: 1, additionalProperties: {type: string}}, count: {type: integer}}
    exit:
      - {kind: output}
      - kind: confirm
        who: owner
        label: 规格侧定了
        separate: "${settings.review.separate}"
        binds: ["${output_dir}/proposal.md", "${output_dir}/spec-delta.yaml", "${output_dir}/interface-delta.yaml", "${output_dir}/ledgers/questions.yaml"]
    rework_to: [clarify, propose]

  # 两个子运行从同一个分叉提交分出去，各在自己的 worktree 里，互相读不到（§6.5）。交付了就由派工器合回这次运行的分支。
  # 打回到这一站：整站打回两路都重新分叉；只打回一个任务（flow_rework 的 tasks）只重做那一路，另一路的结果留着。
  # 两路的检视点经输入 review 传进去：子运行不知道自己是哪条路径的。
  - id: fork
    title: 分两路
    tasks:
      - id: build
        executor:
          kind: subflow
          flow: line-build
          workspace: worktree
          inputs: {title: "${inputs.title}", spec_side: "${stations.seal.output.files}", review: "${settings.review.major}"}
      - id: tests
        executor:
          kind: subflow
          flow: line-tests
          workspace: worktree
          inputs: {title: "${inputs.title}", spec_side: "${stations.seal.output.files}", review: "${settings.review.major}"}
    exit:
      - {kind: children, require: all}
    rework_to: [propose]

  # 两路都合进来了：用黑盒测试跑实现。不自动打回：没过的根在实现还是在测试，由会话按规格判断、记进台账，人决定打回哪一路。
  - id: join
    title: 合起来
    executor: {kind: session}
    skill: join
    writes: ["${output_dir}/**"]
    output:
      type: object
      required: [summary, failures]
      properties:
        summary: {type: string}
        failures: {type: integer, minimum: 0}
        rework:
          type: object
          required: [tasks, reason]
          properties:
            tasks: {type: array, minItems: 1, uniqueItems: true, items: {enum: [build, tests]}}
            reason: {type: string}
    exit:
      - {kind: output}
      - {kind: gate, gate: blackbox}
      - {kind: gate, gate: ledgers-settled}
      - {kind: confirm, who: owner, label: 两路对上了, separate: "${settings.review.separate}"}
    rework_to: [fork, propose]

  - id: verify
    title: 验证
    executor: {kind: session}
    skill: verify
    writes: ["${output_dir}/**"]
    deliverables:
      - {path: verification.md, template: verification.md, description: 验证记录：覆盖（每条需求、每个元素的结论与测试）、连贯性}
    output: {type: object, required: [summary], properties: {summary: {type: string}}}
    exit:
      - {kind: output}
      - {kind: gate, gate: verification}
      - {kind: gate, gate: unit-tests}
      - {kind: gate, gate: ledgers-settled}
    on_unmet: {rework_to: verify, max: 2}
    rework_to: [fork, join]

  # 检视点 verify：验证记录有没有说到做到。缺省关，人在治理文件里手工开。
  - id: review-verify
    title: 检视验证
    when: [{path: settings.review.major.verify, eq: true, label: 检视点 verify 开着（review.major.verify）}]
    executor: {kind: agent, model: "${settings.lines.review.model}"}
    skill: review-verify
    policies: [review-only]
    output:
      type: object
      required: [summary, ready]
      properties: {summary: {type: string}, ready: {type: boolean}}
    exit:
      - {kind: output}
      - {kind: gate, gate: ledgers-settled}
    on_unmet: {rework_to: verify, max: 2}
    rework_to: [verify]

  # 检视不替代人：验收是主人的，在检视之后。
  - id: accept
    title: 验收
    exit:
      - {kind: confirm, who: owner, label: 验收, separate: "${settings.review.separate}"}
    rework_to: [verify, fork, join]

  - id: archive
    title: 归档
    tasks:
      - {id: specs, executor: {kind: command, command: xspec, args: [archive]}}
      - {id: interfaces, executor: {kind: command, command: xarch, args: [archive]}}
    output: {type: object}
    exit:
      - {kind: output}
      - {kind: gate, gate: archived}
      - {kind: gate, gate: interfaces-archived}

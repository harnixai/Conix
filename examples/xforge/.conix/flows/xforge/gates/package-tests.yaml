name: package-tests
title: 这一包登记的验证都过了
description: >-
  任务级出口（task_exit）：跑这一包 xpkg plan --verify 登记的验证，每一项退出码 0 才过。命令来自项目
  .conix/governance/xforge.yaml 的 verify 菜单（人声明的），包里只有名字与参数，参数要整串匹配菜单的正则；
  流程库按 argv 直接起进程，不经 shell。没登记验证就不欠。
kind: command
plan: package-tests
params:
  plan: "${output_dir}/work-packages.yaml"
  item: "${item}"
timeout_seconds: 900

name: publish
title: 外部审批后发布
description: 简报经外部审批系统批准后发布。审批经 MCP 工具建单、轮询（需要 Agix 的 mcp.callTool，harnixai/Agix#111）。
inputs:
  brief: {schema: {type: string}}
stations:
  - id: check
    title: 简报齐全
    exit: [{kind: gate, gate: publish-ready}]

  - id: approve
    title: 外部审批
    exit:
      - kind: confirm
        who: editor
        via: mcp
        timeout: 3d
        mcp:
          server: approvals                      # .conix/settings.json 里配的 MCP server
          request:
            tool: approval_create
            arguments: {title: "发布简报：${subject}", approver: editor, run: "${run}", brief: "${inputs.brief}"}
          status:
            tool: approval_get
            arguments: {id: "${request.id}"}
          decision: {path: status, approved: [approved], rejected: [rejected]}
          by: approver
          link: url
          poll: 30s

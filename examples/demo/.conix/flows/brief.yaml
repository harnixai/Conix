name: brief
title: 笔记整理成简报
description: 读 notes/ 下的笔记，列提纲、分节撰写、汇总成简报，两个模型并行审读，按治理文件下结论，编辑签发后经外部审批发布。
output_dir: "briefs/${flow}-${date}${seq}"
stations:
  - id: outline
    title: 列提纲
    executor: {kind: session}                 # 没写 scene：在运行的主会话里做
    skill: outline
    output:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          minItems: 2
          maxItems: 3
          items: {type: object, required: [id, title, sources]}
    exit:
      - {kind: output}
      - {kind: gate, gate: outline-shape}     # check: schema，读 outline.yaml
    on_unmet: {rework_to: outline, max: 2}

  - id: sections
    title: 分节撰写
    foreach: "${stations.outline.output.sections}"
    max_parallel: 2
    executor: {kind: agent, model: claude-haiku-5-5}   # 主 Agent 派子 Agent，用便宜的模型
    skill: write-section
    output: {type: object, required: [file], properties: {file: {type: string}}}
    exit:
      - {kind: output}
      - {kind: gate, gate: sections-written}  # check: files

  - id: assemble
    title: 汇总成简报
    executor: {kind: session, scene: code, session: new, provider: claude, model: claude-sonnet-5-5}   # 自己的会话，另一个模型
    skill: assemble
    output:
      type: object
      required: [file, summary]
      properties: {file: {type: string}, summary: {type: string}}
    exit:
      - {kind: output}
      - {kind: gate, gate: brief-shape}       # check: text
      - {kind: gate, gate: brief-stats}       # command：tools/notesctl.py stats
    on_unmet: {rework_to: assemble, max: 2}

  - id: reviews
    title: 两个模型并行审读
    tasks:                                    # 两个工作项同时派出，各在自己的会话、各用一家的模型
      - id: facts
        executor: {kind: session, scene: code, session: new, provider: deepseek, model: deepseek-flash}
        skill: review-facts
      - id: policy
        executor: {kind: session, scene: code, session: new, provider: claude, model: claude-sonnet-5-5}
        skill: review-policy
    output:
      type: object
      required: [file, count]
      properties: {file: {type: string}, count: {type: integer, minimum: 1}}
    exit:
      - {kind: output}
      - {kind: gate, gate: facts-shape}       # check: schema，读 reviews/facts.jsonl
      - {kind: gate, gate: policy-shape}      # check: schema，读 reviews/policy.jsonl
      - {kind: gate, gate: reviews-verified}  # command：tools/notesctl.py verify-reviews
    on_unmet: {rework_to: reviews, max: 2}

  - id: govern
    title: 按治理文件下结论
    exit:
      - {kind: gate, gate: governance}        # script：读 governance/policy.yaml，判能不能签发
    on_unmet: {rework_to: assemble, max: 1}   # 不合规矩是简报的问题：回去重写，审读跟着重做

  - id: sign-off
    title: 编辑签发
    exit:
      - {kind: gate, gate: untouched}         # check: sealed：过了门禁的文件后来没被改过
      - {kind: confirm, who: editor, label: 编辑签发, timeout: 3d}
    rework_to: [assemble]

  - id: publish
    title: 外部审批后发布
    exit:
      - kind: confirm
        who: editor
        via: mcp
        timeout: 3d
        mcp:
          server: approvals                    # .conix/settings.json 里配的 MCP server
          request:
            tool: approval_create
            arguments: {title: "发布简报：${subject}", approver: editor, run: "${run}", brief: "${stations.assemble.output.file}"}
          status:
            tool: approval_get
            arguments: {id: "${request.id}"}
          decision: {path: status, approved: [approved], rejected: [rejected]}
          by: approver
          link: url
          poll: 30s

name: brief
title: 笔记整理成简报
description: 读 notes/ 下的笔记，列提纲、分节撰写、汇总成简报，三类门禁把关，最后由编辑签发。
output_dir: "briefs/${flow}-${date}${seq}"
stations:
  - id: outline
    title: 列提纲
    executor: {kind: session}                 # 没写 scene：在运行的主会话里做
    skill: outline
    output:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          minItems: 2
          maxItems: 3
          items: {type: object, required: [id, title, sources]}
    exit:
      - {kind: output}
      - {kind: gate, gate: outline-shape}
    on_unmet: {rework_to: outline, max: 2}

  - id: sections
    title: 分节撰写
    foreach: "${stations.outline.output.sections}"
    max_parallel: 2
    executor: {kind: agent, model: claude-haiku-5-5}   # 主 Agent 派子 Agent，用便宜的模型
    skill: write-section
    output: {type: object, required: [file], properties: {file: {type: string}}}
    exit:
      - {kind: output}
      - {kind: gate, gate: sections-written}

  - id: assemble
    title: 汇总成简报
    executor: {kind: session, scene: code, model: claude-sonnet-5-5, session: new}   # 自己的会话，另一个模型
    skill: assemble
    output:
      type: object
      required: [file, summary]
      properties: {file: {type: string}, summary: {type: string}}
    exit:
      - {kind: output}
      - {kind: gate, gate: brief-shape}
      - {kind: gate, gate: sources-cited}
      - {kind: gate, gate: brief-stats}
    on_unmet: {rework_to: assemble, max: 2}

  - id: review
    title: 编辑签发
    exit:
      - {kind: gate, gate: untouched}
      - {kind: confirm, who: editor, label: 编辑签发, timeout: 3d}
    rework_to: [assemble]

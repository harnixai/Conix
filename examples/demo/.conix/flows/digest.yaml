name: digest
title: 每份笔记一句话
description: 每份笔记开一个子运行写一句话摘要；个别失败也能过，最后查汇总。
stations:
  - id: list
    title: 列出笔记
    executor: {kind: session}
    skill: list-notes
    output:
      type: object
      required: [notes]
      properties: {notes: {type: array, minItems: 1, items: {type: string}}}
    exit: [{kind: output}]

  - id: each
    title: 逐份摘要
    foreach: "${stations.list.output.notes}"
    max_parallel: 2
    executor: {kind: subflow, flow: digest-note, inputs: {path: "${item}"}}
    exit: [{kind: children, require: any}]     # 至少一个子运行交付就过

  - id: check
    title: 查汇总
    exit: [{kind: gate, gate: digest-complete}]

name: digest-note
title: 一份笔记一句话
inputs:
  path: {schema: {type: string}}
result:                                          # 交给父运行的就是这个值
  from: {path: "${inputs.path}", line: "${stations.summarize.output.line}"}
  schema:
    type: object
    required: [path, line]
    properties: {path: {type: string}, line: {type: string, minLength: 10}}
stations:
  - id: summarize
    title: 写一句话
    executor: {kind: session}
    skill: digest-note
    output: {type: object, required: [line], properties: {line: {type: string}}}
    exit: [{kind: output}]

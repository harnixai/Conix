name: outline-shape
title: 提纲的格式
kind: check
check: schema
file: "${output_dir}/outline.yaml"      # 按扩展名读成 YAML
schema:
  type: object
  required: [title, sections]
  properties:
    title: {type: string, minLength: 1}
    sections:
      type: array
      minItems: 2
      maxItems: 3
      items:
        type: object
        required: [id, title, sources]
        properties:
          id: {type: string, pattern: "^[a-z0-9-]+$"}
          title: {type: string, minLength: 1}
          sources:
            type: array
            minItems: 1
            items: {type: string, pattern: "^notes/[a-z0-9-]+\\.md$"}

name: policy-shape
title: 规范审读的格式
kind: check
check: schema
file: "${output_dir}/reviews/policy.jsonl"
schema:
  type: array
  minItems: 3
  items:
    type: object
    required: [rule, verdict, message]
    properties:
      rule: {type: string, pattern: "^[a-z0-9-]+$"}   # 治理文件 style 里的 id；每条都判了没有由 governance 查
      verdict: {enum: [ok, violated]}
      message: {type: string, minLength: 2}

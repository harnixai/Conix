name: xforge-station
title: XForge 站
description: 站里经 RunExt 跑 xflow / xspec / xforge 命令；xforge/ 下的结构化数据由守卫（tool.around）挡住模型直接写。
# 不在这里按路径拒 Write / Edit：按路径判的规则让这一站的每次写都先问派工器，而插件命令里的写问不了人，
# 命令写 xforge/ 就一律失败。模型直接写的那一侧由 scripts/guard.js 拒。
permissions:
  - effect: allow
    tools: [RunExt]
    commands: ["xflow *", "xspec *", "xforge *"]

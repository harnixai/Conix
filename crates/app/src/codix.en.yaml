# Codix configuration. Delete this file and it is regenerated with defaults on next start.
# Models, providers and permissions are Agix's (settings.json in the same directory); only Codix's own settings live here.

ui:
  # UI language: zh, en, or auto (follow the LANG environment variable). CODIX_LANG overrides it temporarily.
  # Your own language files go in ~/.codix/locales/<lang>/*.yaml, written like the zh ones (see crates/i18n/locales).
  language: en
  # Size (columns x rows) to ask the terminal for at startup; if it does not respond the actual size is used. Write off to not ask.
  initial_size: 160x45
  # Percentage of the width the left pane (chat) takes on wide screens, 40-75.
  ratio: 60
  # How many lines of a tool result to show in brief mode; the rest is folded (^O shows all).
  compact_tool_lines: 3
  # Syntax highlighting theme for code blocks. Options: base16-ocean.dark, base16-eighties.dark, base16-mocha.dark,
  # base16-ocean.light, InspiredGitHub, Solarized (dark), Solarized (light)
  syntax_theme: base16-ocean.dark
  theme:
    # Preset: claude (orange) or aqua.
    preset: claude
    # Override single colors on top of the preset: #RRGGBB, a color name (red, gray, ...) or a 0-255 terminal color number.
    # Available: accent accent_fg bar_bg bar_fg border border_focus dim selected_bg (selected row, focused block)
    # selected_bg_inactive (selected row, other block) selected_fg ok warn error add del code link user_bg
    colors: {}
    #   accent: "#D97757"
    #   border: "238"

instance:
  # How long idle before auto-detaching and releasing the instance: 30m, 2h, 0 (never).
  idle_timeout: 30m

# Guardrails for scheduled jobs: stop unattended work that runs away, hangs or piles up
# (the jobs tab shows the values in effect for each job).
jobs:
  # Used when a job does not set its own. Durations like 30m, 2h; tokens like 2M, 500k.
  defaults:
    timeout: 30m        # how long one firing may run
    max_tokens: 2M      # how many tokens one firing may use (uncached input + cache writes + output, sub-agents included)
    overlap: skip       # when due while the previous one still runs: skip, queue one, or replace it
    disable_after: 3    # disable the job on this machine after this many failures in a row; 0 = never
    network: deny_all   # network for a job's commands: deny_all none, allowlist only web.allowed_domains, inherit the settings
  # Ceilings: a job definition committed to the repository cannot go above them.
  limits:
    timeout: 4h
    max_tokens: 20M
  daily_tokens: 50M     # all unattended work of this instance in one day; 0 = no limit
  max_concurrent: 2     # firings running at the same time

# Notifications: commands run when something in the instance needs you (a run waits for
# confirmation, a job failed, the daily budget is used up …). Not configured = nothing is sent;
# you see it under "while you were away" next time you attach. Only this file is read for it,
# never a project's files. Placeholders: {instance} {project} {kind} {level} {title} {text} {attach}
# ({attach} is the ssh command that gets you back).
# notify:
#   when: detached        # detached: only while no TUI is attached; always
#   min_level: warn       # info | warn | error
#   sinks:
#     - name: desktop
#       command: ["terminal-notifier", "-title", "Codix {instance}", "-message", "{title}"]
#     - name: phone
#       command: ["sh", "-c", "curl -s -d @- https://ntfy.sh/$CODIX_NTFY_TOPIC"]
#       stdin: json       # the whole notification as JSON on stdin
#       min_level: error

# Model of the engine's built-in anthropic provider (like agixd --model). Used only when
# settings.json defines no providers; the CODIX_MODEL environment variable wins. Unset = Agix's default.
# engine:
#   model: claude-sonnet-4-6

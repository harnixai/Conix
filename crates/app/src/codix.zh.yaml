# Codix 的配置。删掉这个文件，下次启动会按缺省重新生成。
# 模型、provider、权限这些沿用 Agix 的 settings.json（同一目录），这里只放 Codix 自己的。

ui:
  # 界面语言：zh、en，或 auto（照 LANG 环境变量）。也可以用 CODIX_LANG 临时指定。
  # 自己的语言资源放在 ~/.codix/locales/<语言>/*.yaml，格式照 zh 的写（见 crates/i18n/locales）。
  language: zh
  # 启动时请求终端调整到这个尺寸（列x行）；终端不响应就按实际尺寸。写 off 不请求。
  initial_size: 160x45
  # 宽屏时左栏（对话区）占的百分比，40–75。
  ratio: 60
  # 精简模式下工具结果显示几行，其余折起来（^O 看全部）。
  compact_tool_lines: 3
  # 代码块的语法高亮主题。可选：base16-ocean.dark、base16-eighties.dark、base16-mocha.dark、
  # base16-ocean.light、InspiredGitHub、Solarized (dark)、Solarized (light)
  syntax_theme: base16-ocean.dark
  theme:
    # 预设：claude（橙）或 aqua（水蓝）。
    preset: claude
    # 在预设基础上改个别颜色：#RRGGBB、颜色名（red、gray……）或 0–255 的终端色号。
    # 可改的有：accent accent_fg bar_bg bar_fg border border_focus dim selected_bg（有焦点那块的选中行）
    # selected_bg_inactive（另一块的选中行） selected_fg ok warn error add del code link user_bg
    colors: {}
    #   accent: "#D97757"
    #   border: "238"

instance:
  # 空闲多久自动脱离，让出实例：30m、2h、0（不超时）。
  idle_timeout: 30m

# 作业的护栏：无人值守的工作跑飞、挂住、叠起来时把它停下（作业页能看到每个作业实际生效的值）。
jobs:
  # 作业自己没写时用。时长写 30m、2h；token 写 2M、500k。
  defaults:
    timeout: 30m        # 一次触发至多跑多久
    max_tokens: 2M      # 一次触发至多用多少 token（未命中缓存的输入 + 缓存写入 + 输出，含子 Agent）
    overlap: skip       # 到点时上一次还在跑：skip 跳过、queue 排一个、replace 停下上一次
    disable_after: 3    # 连续失败几次就在这台机器上停用；0 不停
    network: deny_all   # 作业里命令的出网：deny_all 不出网、allowlist 只到 web.allowed_domains、inherit 照设置
  # 天花板：仓库里提交的作业定义写得再大也不超过它。
  limits:
    timeout: 4h
    max_tokens: 20M
  daily_tokens: 50M     # 这个实例所有无人值守的工作一天合计；0 不限
  max_concurrent: 2     # 同时在跑的触发

# 通知：实例里有事等你处理（运行等确认、作业失败、额度用完……）时执行的命令。不配就不发，
# 下次接入时在"离开期间"里看到。只认这里的配置，项目里的文件改不了它。
# 占位符：{instance} {project} {kind} {level} {title} {text} {attach}（attach 是回来的那句 ssh 命令）。
# notify:
#   when: detached        # detached：没有 TUI 接着时才发；always：一直发
#   min_level: warn       # info | warn | error
#   sinks:
#     - name: desktop
#       command: ["terminal-notifier", "-title", "Codix {instance}", "-message", "{title}"]
#     - name: phone
#       command: ["sh", "-c", "curl -s -d @- https://ntfy.sh/$CODIX_NTFY_TOPIC"]
#       stdin: json       # 整条通知以 JSON 写进 stdin
#       min_level: error

# 引擎自带 anthropic 的模型（相当于 agixd --model）。只在 settings.json 没定义 providers 时用；
# CODIX_MODEL 环境变量优先。不写就用 Agix 的缺省。

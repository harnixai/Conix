  st_installed: "installed"
  st_modified: "modified (vs lock)"
  st_update: "global has {version}"
  st_project_only: "project only"
  st_not_installed: "not installed"
  st_gone: "in the lock, directory gone"
  bi_pristine: "built-in, unmodified"
  bi_modified: "built-in, modified"
  bi_removed: "built-in, removed (reset brings it back)"

# Managing flow bundles: the global library, projects, the output of conix flow (docs/design/flows.md §7.12).
flowlib:
  registry_header: "The Conix global flow library: where each bundle came from, its version and digest (kept by conix flow; do not edit)"
  lock_header: "Flow bundles installed into this project from the global library (kept by conix flow install / update; commit it). Digests leave out skills/*/local.md"
  and_more: " and {n} more"
  no_global: "No {name} in the global flow library (conix flow list --global shows what is there; conix flow import brings a package file in)"
  not_in_project: "No flow bundle {name} in the project"
  not_installed: "{name} is not installed in the project: conix flow install {name}"
  not_builtin: "{name} is not a flow bundle built into this Conix"
  install_exists: "{name} is already in the project: conix flow update {name} takes the global library's (or install --force, the old one is backed up first)"
  update_same: "{name} is already the same as the global library's {version}"
  update_same_version: "{name} is {version} both here and in the global library, nothing to update (--force reinstalls the global library's)"
  update_older: "The global library has {name} {global}, older than the project's {project}: --force downgrades"
  update_modified: "{name} was changed in the project after it was installed (it no longer matches .conix/flows.lock.yaml); the update would change: {files}. --force overwrites it (the project's copy is backed up first), or conix flow backfill {name} puts it into the global library first"
  remove_runs: "Runs in flight in the project use {name} ({runs}): removing it breaks their skills and templates. --force removes it anyway"
  backfill_same: "The global library's {name} is already the same as the project's"
  backfill_same_version: "The project's {name} and the global library's are both {version} but differ: bump version in bundle.yaml, or --force"
  backfill_older: "The global library has {name} {global}, newer than the project's {project}; backfilling would overwrite it: --force"
  reset_same: "The global library's {name} is already the one this Conix ships"
  import_exists_global: "{name} is already in the global library: --force replaces it (the old one is backed up first)"
  import_exists_project: "{name} is already in the project: --force replaces it (the old one is backed up first, skills' local.md carried over)"
  clean_nothing: "Nothing to clean"
  changed_meanwhile: "{name} was changed elsewhere while you were confirming: nothing done, run it again"
  note_gates: "The bundle has {n} command gates: they run only in trusted projects"
  note_lock_only: "Already the same content: only recorded in .conix/flows.lock.yaml"
  note_remove_builtin: "{name} is built in: conix flow reset {name} brings it back"
  note_remove_runs: "Runs using it are still in flight: {runs}"
  note_backfill_builtin: "{name} is built in: after the backfill the global copy is a modified built-in, conix flow reset {name} goes back to the shipped one"
  note_import_by: "Exported by Conix {conix} ({at})"
  boot_extracted: "Flow library: the built-in {name} {version} is now in the global library (conix flow install {name} puts it in a project)"
  boot_upgraded: "Flow library: the unmodified built-in {name} in the global library was upgraded from {from} to {to}"
  boot_failed: "Flow library: the built-in {name} could not be put into the global library: {error}"
  st_installed: "installed"
  st_modified: "modified (vs lock)"
  st_update: "global has {version}"
  st_project_only: "project only"
  st_not_installed: "not installed"
  st_gone: "in the lock, directory gone"
  bi_pristine: "built-in, unmodified"
  bi_modified: "built-in, modified"
  bi_removed: "built-in, removed (reset brings it back)"
  bi_missing: "built-in, directory gone"
  bi_newer: "; this Conix ships {version} (reset takes it)"
  col_project: "project"
  col_global: "global"
  list_none_project: "No flow bundles in the project. conix flow list --global shows the global library, conix flow install <bundle> puts one here."
  list_none_global: "The global flow library is empty."
  show_requires: "Requires: Conix {requires}"
  show_source: "Source: {source}"
  show_from_global: "installed from the global library, {version} ({at})"
  show_dir: "Directory: {dir}"
  where_project: "project"
  where_global: "global library"
  plan_head: "{action} {name} {versions} ({place})"
  plan_files: "Files: {added} added, {changed} changed, {removed} removed"
  plan_backup: "The old one is backed up to: {dir}/"
  plan_clean: "Clean ({place}):"
  plan_orphan: "drop the orphan entry: {name}"
  cli_ask: "Go ahead? [y/N]"
  cli_cancelled: "Nothing done."
  cli_dry_run: "(--dry-run: listed only, nothing done)"
  cli_need_yes: "Not in a terminal: add --yes to go ahead (or look first with --dry-run)"
  cli_some_failed: "{n} not done"
  cli_update_which: "Update which: give a bundle, or --all"
  cli_reset_which: "Reset which: give a bundle, or --all"
  cli_verify_which: "Verify which archive: give its directory, or --all"
  done: "Done: {action} {name}"
  done_backup: "The old one is in: {dir}"
  notified: "Told instance {name} to re-read its flows"
  diff_head: "{name}: project {project}, global library {global} (the project against the global library: + only in the project, ~ changed, - not in the project)"
  diff_same: "The same content"

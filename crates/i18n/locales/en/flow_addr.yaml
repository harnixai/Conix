# Flow addresses (/flow:<bundle>..., and /<bundle>:<station> inside a run): hints, summaries, completion kind labels.
flow_addr:
  global_hint: "/{name} is not in a flow, so it went to Agix; to act on the flow bundle write /flow:{name} here"
  no_bundle: "No flow bundle \"{name}\"; there are: {names}"
  unknown_name: "\"{bundle}\" has no flow, station or command called {name}"
  no_active_run: "{bundle} has no active run: a station operation needs one"
  which_run: "{bundle} has several active runs ({runs}); give the run id or select it in the Flows tab"
  needs_subject: "A subject is required: /flow:{bundle} <subject> [--k v] [--step]"
  bundles_title: "Flow bundles"
  d_flows: "Flows: {v}"
  d_commands: "Commands: {v}"
  d_stations: "Stations: {v}"
  d_no_runs: "No active runs"
  d_runs: "Active runs:"
  d_usage: "Usage: /flow:{b} <subject> [--k v] [--step] starts; /flow:{b}:<flow|station|command> ..."
  s_current: "Current station: {title} ({id}) {state}"
  s_exit: "Exit: {v}"
  s_unmet: "Unmet: {v}"
  s_votes: "Confirm: {n}/{min} votes"
  s_waiting: "Waiting: {v}"
  started: "Started \"{subject}\" ({id})"
  triage_started: "Triage started in the main session: the model picks the flow"
  kind_bundle: "bundle"
  kind_flow: "flow"
  kind_station: "station"
  kind_command: "command"

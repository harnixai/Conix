      - assistant:
          text: |
            我先看一下现有的认证入口，再决定怎么切。

            目前的思路分三步：

            - 保留 `AuthProvider` trait，新增 `OAuthProvider` 实现
            - 会话存储从内存表换成带过期的存储
            - 登录与回调路由改走授权码流程

            新 provider 的骨架大致是这样：

            ```rust
            pub struct OAuthProvider {
                client: BasicClient,
                scopes: Vec<Scope>,
            }

            impl AuthProvider for OAuthProvider {
                fn authorize_url(&self) -> (Url, CsrfToken) {
                    self.client.authorize_url(CsrfToken::new_random).url()
                }
            }
            ```

            先读代码，再动手。
      - thinking: {text: 现有 mod.rs 里 token 校验和会话管理混在一起，先拆出 provider 再换实现，改动面更小。}
      - tool:
          id: tu1
          name: Read
          input: src/auth/mod.rs
          content: |
            use std::collections::HashMap;
            use std::sync::RwLock;
            use std::time::{Duration, Instant};

            pub mod token;

            pub struct Session {
                pub user: String,
                pub expires: Instant,
            }

            pub trait AuthProvider: Send + Sync {
                fn verify(&self, token: &str) -> Result<String, AuthError>;
            }

            pub struct StaticProvider {
                tokens: HashMap<String, String>,
            }

            impl AuthProvider for StaticProvider {
                fn verify(&self, token: &str) -> Result<String, AuthError> {
                    self.tokens
                        .get(token)
                        .cloned()
                        .ok_or(AuthError::InvalidToken)
                }
            }

            #[derive(Debug)]
            pub enum AuthError {
                InvalidToken,
                Expired,
            }

            pub struct SessionStore {
                inner: RwLock<HashMap<String, Session>>,
                ttl: Duration,
            }

            impl SessionStore {
                pub fn new(ttl: Duration) -> Self {
                    Self { inner: RwLock::new(HashMap::new()), ttl }
                }

                pub fn insert(&self, id: String, user: String) {
                    let expires = Instant::now() + self.ttl;
                    self.inner.write().unwrap().insert(id, Session { user, expires });
                }

                pub fn get(&self, id: &str) -> Option<String> {
                    let map = self.inner.read().unwrap();
                    map.get(id)
                        .filter(|s| s.expires > Instant::now())
                        .map(|s| s.user.clone())
                }
            }
      - tool:
          id: tu2
          name: Grep
          input: "AuthProvider|StaticProvider"
          content: |
            src/auth/mod.rs:13:pub trait AuthProvider: Send + Sync {
            src/auth/mod.rs:21:impl AuthProvider for StaticProvider {

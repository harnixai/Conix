flows:
  - summary: {name: feature-to-ship, title: 需求到上线, origin: builtin, active_runs: 2}
    stations:
      - {"id": "collect", "title": "收集需求", "work": "session", "skill": "gather-requirements", "exit": ["output"], "status": "pending"}
      - {"id": "design", "title": "设计", "needs": ["collect"], "work": "session", "skill": "write-design", "exit": ["output", "confirm"], "status": "pending"}
      - {"id": "impl", "title": "实现", "needs": ["design"], "work": "agent × 2", "skill": "implement", "exit": ["output", "gate: ci"], "status": "pending"}
      - {"id": "review-code", "title": "代码评审", "needs": ["impl"], "work": "agent", "skill": "review-code", "exit": ["output"], "status": "pending"}
      - {"id": "review-docs", "title": "文档评审", "needs": ["impl"], "work": "agent", "skill": "review-docs", "exit": ["output"], "status": "pending"}
      - {"id": "sign", "title": "评审汇总", "needs": ["review-code", "review-docs"], "work": "confirm", "exit": ["confirm"], "status": "pending"}
      - {"id": "ship", "title": "上线", "needs": ["sign"], "work": "gate: ci", "exit": ["gate: ci"], "status": "pending"}
    yaml: |
      name: feature-to-ship
      title: 需求到上线
      inputs:
        subject: {type: string, description: 需求的一句话说明}
      stations:
        - id: collect
          title: 收集需求
          executor: {kind: session}
          skill: gather-requirements
          output: {type: object, required: [requirements]}
          exit: [{kind: output}]
        - id: design
          title: 设计
          needs: [collect]
          executor: {kind: session}
          skill: write-design
          output: {type: object, required: [plan]}
          exit: [{kind: output}, {kind: confirm}]
        - id: impl
          title: 实现
          needs: [design]
          tasks:
            - {id: backend, executor: {kind: agent}, skill: implement}
            - {id: frontend, executor: {kind: agent}, skill: implement}
          output: {type: object}
          exit: [{kind: output}, {kind: gate, gate: ci}]
        - id: review-code
          title: 代码评审
          needs: [impl]
          executor: {kind: agent, agent_type: reviewer}
          skill: review-code
          output: {type: object}
          exit: [{kind: output}]
        - id: review-docs
          title: 文档评审
          needs: [impl]
          executor: {kind: agent}
          skill: review-docs
          output: {type: object}
          exit: [{kind: output}]
        - id: sign
          title: 评审汇总
          needs: [review-code, review-docs]
          exit: [{kind: confirm}]
          rework_to: [impl]
        - id: ship
          title: 上线
          needs: [sign]
          exit: [{kind: gate, gate: ci}]
  - summary: {name: weekly-report, title: 周报, origin: project, active_runs: 0}
    stations:
      - {"id": "collect", "title": "收集", "work": "session", "skill": "collect-tickets", "exit": ["output"], "status": "pending"}
      - {"id": "summarize", "title": "汇总", "needs": ["collect"], "work": "session", "skill": "summarize-week", "exit": ["output"], "status": "pending"}
      - {"id": "confirm", "title": "待确认", "needs": ["summarize"], "work": "confirm", "exit": ["confirm"], "status": "pending"}
    yaml: |
      name: weekly-report
      title: 周报
      stations:
        - id: collect
          title: 收集
          executor: {kind: session}
          skill: collect-tickets
          output: {type: object}
          exit: [{kind: output}]
        - id: summarize
          title: 汇总
          needs: [collect]
          executor: {kind: session}
          skill: summarize-week
          output: {type: object}
          exit: [{kind: output}]
        - id: confirm
          title: 待确认
          needs: [summarize]
          exit: [{kind: confirm}]
  - summary: {name: release-check, title: 发布检查, origin: plugin, active_runs: 0}
    stations:
      - {"id": "lint", "title": "静态检查", "work": "program", "exit": ["gate: lint"], "status": "pending"}
      - {"id": "smoke", "title": "冒烟测试", "needs": ["lint"], "work": "agent", "skill": "smoke-test", "exit": ["output"], "status": "pending"}
      - {"id": "approve", "title": "放行确认", "needs": ["smoke"], "work": "confirm", "exit": ["confirm"], "status": "pending"}
      - {"id": "notify", "title": "通知", "needs": ["approve"], "work": "program", "exit": ["output"], "status": "pending"}
    yaml: |
      name: release-check
      title: 发布检查
      stations:
        - id: lint
          title: 静态检查
          executor: {kind: program, program: lint}
          exit: [{kind: gate, gate: lint}]
        - id: smoke
          title: 冒烟测试
          needs: [lint]
          executor: {kind: agent}
          skill: smoke-test
          output: {type: object}
          exit: [{kind: output}]
        - id: approve
          title: 放行确认
          needs: [smoke]
          exit: [{kind: confirm}]
        - id: notify
          title: 通知
          needs: [approve]
          executor: {kind: program, program: notify}
          exit: [{kind: output}]


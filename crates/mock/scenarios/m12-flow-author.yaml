# 场景 m12：在用户会话里改流程。说「加一个安全评审站」会得到更新后的定义（flow_detail）；按流程标签的 m 起的话头说「启动一次运行，主题新功能演示」，会得到新运行 r5。
name: m12-flow-author
seed: default
rules:
  - on: {submit: {text: 加一个安全评审站}}
    once: true
    then:
      - {after: 0, turn_started: {"session": "$session"}}
      - {after: 150, text_delta: {"session": "$session", "text": "好的，我在「实现」之后加一个安全评审站。\n\n"}}
      - {after: 120, text_delta: {"session": "$session", "text": "- 新站 `security`（安全评审）：依赖 `impl`，由子 Agent 按 `security-review` 技能检查，出口是输出契约；\n"}}
      - {after: 120, text_delta: {"session": "$session", "text": "- 它与代码评审、文档评审并行，所以「评审汇总」改为同时等这三站。\n\n"}}
      - {after: 120, text_delta: {"session": "$session", "text": "定义已更新，设计卡里可以看到新的站。\n"}}
      - {after: 200, flow_detail: {"summary": {"name": "feature-to-ship", "title": "需求到上线", "origin": "builtin", "active_runs": 2}, "stations": [{"id": "collect", "title": "收集需求", "work": "session", "skill": "gather-requirements", "exit": ["output"], "status": "pending"}, {"id": "design", "title": "设计", "needs": ["collect"], "work": "session", "skill": "write-design", "exit": ["output", "confirm"], "status": "pending"}, {"id": "impl", "title": "实现", "needs": ["design"], "work": "agent × 2", "skill": "implement", "exit": ["output", "gate: ci"], "status": "pending"}, {"id": "review-code", "title": "代码评审", "needs": ["impl"], "work": "agent", "skill": "review-code", "exit": ["output"], "status": "pending"}, {"id": "review-docs", "title": "文档评审", "needs": ["impl"], "work": "agent", "skill": "review-docs", "exit": ["output"], "status": "pending"}, {"id": "security", "title": "安全评审", "needs": ["impl"], "work": "agent", "skill": "security-review", "exit": ["output"], "status": "pending"}, {"id": "sign", "title": "评审汇总", "needs": ["review-code", "review-docs", "security"], "work": "confirm", "exit": ["confirm"], "status": "pending"}, {"id": "ship", "title": "上线", "needs": ["sign"], "work": "gate: ci", "exit": ["gate: ci"], "status": "pending"}], "yaml": "name: feature-to-ship\ntitle: 需求到上线\ninputs:\n  subject: {type: string, description: 需求的一句话说明}\nstations:\n  - id: collect\n    title: 收集需求\n    executor: {kind: session}\n    skill: gather-requirements\n    output: {type: object, required: [requirements]}\n    exit: [{kind: output}]\n  - id: design\n    title: 设计\n    needs: [collect]\n    executor: {kind: session}\n    skill: write-design\n    output: {type: object, required: [plan]}\n    exit: [{kind: output}, {kind: confirm}]\n  - id: impl\n    title: 实现\n    needs: [design]\n    tasks:\n      - {id: backend, executor: {kind: agent}, skill: implement}\n      - {id: frontend, executor: {kind: agent}, skill: implement}\n    output: {type: object}\n    exit: [{kind: output}, {kind: gate, gate: ci}]\n  - id: review-code\n    title: 代码评审\n    needs: [impl]\n    executor: {kind: agent, agent_type: reviewer}\n    skill: review-code\n    output: {type: object}\n    exit: [{kind: output}]\n  - id: review-docs\n    title: 文档评审\n    needs: [impl]\n    executor: {kind: agent}\n    skill: review-docs\n    output: {type: object}\n    exit: [{kind: output}]\n  - id: security\n    title: 安全评审\n    needs: [impl]\n    executor: {kind: agent}\n    skill: security-review\n    output: {type: object}\n    exit: [{kind: output}]\n  - id: sign\n    title: 评审汇总\n    needs: [review-code, review-docs, security]\n    exit: [{kind: confirm}]\n    rework_to: [impl]\n  - id: ship\n    title: 上线\n    needs: [sign]\n    exit: [{kind: gate, gate: ci}]\n"}}
      - {after: 100, turn_ended: {"session": "$session", "stop": "end_turn", "usage": {"input": 1800, "output": 260}}}
  - on: {submit: {text: "流程 #1「需求到上线」：启动一次运行，主题新功能演示"}}
    once: true
    then:
      - {after: 0, turn_started: {"session": "$session"}}
      - {after: 150, text_delta: {"session": "$session", "text": "已按「需求到上线」启动一次运行，主题「新功能演示」，现在在第一站「收集需求」。\n"}}
      - {after: 200, run_detail: {"summary": {"id": "r5", "flow": "feature-to-ship", "subject": "新功能演示", "status": "running", "current": "收集需求", "stations_done": 0, "stations_total": 7, "started_ms": 1763280003000, "usage": {"input": 300, "output": 80}}, "main_session": "s3", "stations": [{"id": "collect", "title": "收集需求", "work": "session", "skill": "gather-requirements", "exit": ["output"], "status": "working", "elapsed_ms": 2000, "usage": {"input": 300, "output": 80}}, {"id": "design", "title": "设计", "needs": ["collect"], "work": "session", "skill": "write-design", "exit": ["output", "confirm"], "status": "pending"}, {"id": "impl", "title": "实现", "needs": ["design"], "work": "agent × 2", "skill": "implement", "exit": ["output", "gate: ci"], "status": "pending"}, {"id": "review-code", "title": "代码评审", "needs": ["impl"], "work": "agent", "skill": "review-code", "exit": ["output"], "status": "pending"}, {"id": "review-docs", "title": "文档评审", "needs": ["impl"], "work": "agent", "skill": "review-docs", "exit": ["output"], "status": "pending"}, {"id": "sign", "title": "评审汇总", "needs": ["review-code", "review-docs"], "work": "confirm", "exit": ["confirm"], "status": "pending"}, {"id": "ship", "title": "上线", "needs": ["sign"], "work": "gate: ci", "exit": ["gate: ci"], "status": "pending"}]}}
      - {after: 0, run_upserted: {"id": "r5", "flow": "feature-to-ship", "subject": "新功能演示", "status": "running", "current": "收集需求", "stations_done": 0, "stations_total": 7, "started_ms": 1763280003000, "usage": {"input": 300, "output": 80}}}
      - {after: 100, turn_ended: {"session": "$session", "stop": "end_turn", "usage": {"input": 900, "output": 120}}}

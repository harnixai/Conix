[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["agix", "archive"]

[workspace.package]
version = "0.1.9-2026112501"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
repository = "https://github.com/harnixai/Conix"

[workspace.dependencies]
port  = { path = "crates/port" }
tui   = { path = "crates/tui" }
keys  = { path = "crates/keys" }
model = { path = "crates/model" }
mock  = { path = "crates/mock" }
i18n  = { path = "crates/i18n" }
wire  = { path = "crates/wire" }
client = { path = "crates/client" }
host  = { path = "crates/host" }
engine = { path = "crates/engine" }
app   = { path = "crates/app" }
# 流程库：从 Harnix-v0.4.7 分叉，在 Conix 里改（docs/design/flows.md）；包名沿用，往回迁时对得上。
harnix-flow = { path = "crates/flow" }

# 与流程库用同一个 YAML 库，不多出第二个。
serde_yaml  = "0.9"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
thiserror   = "2"
anyhow      = "1"
ratatui     = { version = "0.30", default-features = false }
crossterm   = { version = "0.29", features = ["event-stream"] }
futures     = "0.3"
unicode-width = "0.2"
unicode-segmentation = "1"
clap        = { version = "4", features = ["derive"] }
syntect     = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
tempfile    = "3"
nix         = { version = "0.29", features = ["fs", "signal", "process", "user", "hostname", "term"] }
croner      = "2"
chrono      = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing     = "0.1"
uuid        = { version = "1", features = ["v4", "v5"] }
# 与 harnix-flow 用的同一个版本：校验流程作业的 inputs。
jsonschema  = { version = "0.49", default-features = false }
# 与 Agix 用的同一个版本：读插件 plugin.toml 里 Conix 自己的段、算 zip 的 SHA-256。
toml        = "0.8"
sha2        = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"
